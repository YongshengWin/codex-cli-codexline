<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Codexline advanced configuration editor</title>
  <desc id="desc">A terminal-native three-pane editor for module ordering, responsive visibility, live previews, and TOML changes.</desc>
  <rect width="1200" height="690" fill="#0b0d0e"/>
  <rect x="20" y="20" width="1160" height="650" fill="#0b0d0e" stroke="#38423d"/>
  <rect x="20" y="20" width="1160" height="42" fill="#111416"/>
  <text x="42" y="47" fill="#f1f5f2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">CODEXLINE CONFIG</text>
  <text x="201" y="47" fill="#606a65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">~/.config/codexline/config.toml</text>
  <circle cx="830" cy="41" r="4" fill="#67d8ef"/><text x="841" y="45" fill="#67d8ef" font-family="ui-monospace, monospace" font-size="9">HOOKS</text>
  <circle cx="898" cy="41" r="4" fill="#6ee7a8"/><text x="909" y="45" fill="#6ee7a8" font-family="ui-monospace, monospace" font-size="9">PTY</text>
  <circle cx="955" cy="41" r="4" fill="#f3c969"/><text x="966" y="45" fill="#f3c969" font-family="ui-monospace, monospace" font-size="9">APP</text>
  <text x="1128" y="45" text-anchor="end" fill="#f37b83" font-family="ui-monospace, monospace" font-size="9">UNSAVED 1</text>

  <line x1="230" y1="62" x2="230" y2="626" stroke="#29302d"/>
  <line x1="800" y1="62" x2="800" y2="626" stroke="#29302d"/>
  <rect x="20" y="62" width="210" height="564" fill="#111416"/>
  <rect x="800" y="62" width="380" height="564" fill="#111416"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="42" y="98" fill="#606a65" font-size="9" font-weight="700" letter-spacing="2">CATEGORIES</text>
    <text x="54" y="140" fill="#98a39d" font-size="12">Presets</text>
    <rect x="20" y="156" width="210" height="34" fill="#1a1f21"/>
    <rect x="20" y="156" width="4" height="34" fill="#6ee7a8"/>
    <text x="42" y="178" fill="#6ee7a8" font-size="12">› Layout</text>
    <text x="54" y="218" fill="#98a39d" font-size="12">Modules</text>
    <text x="54" y="258" fill="#98a39d" font-size="12">Theme</text>
    <text x="54" y="298" fill="#98a39d" font-size="12">Compatibility</text>
    <text x="54" y="338" fill="#98a39d" font-size="12">Advanced</text>

    <text x="258" y="98" fill="#606a65" font-size="9" font-weight="700" letter-spacing="2">PRESET</text>
    <rect x="258" y="116" width="126" height="32" fill="#111416" stroke="#29302d"/>
    <rect x="384" y="116" width="126" height="32" fill="#111416" stroke="#29302d"/>
    <rect x="510" y="116" width="126" height="32" fill="#111416" stroke="#29302d"/>
    <rect x="636" y="116" width="136" height="32" fill="#1a1f21" stroke="#6ee7a8"/>
    <text x="321" y="136" text-anchor="middle" fill="#606a65" font-size="10">FULL</text>
    <text x="447" y="136" text-anchor="middle" fill="#606a65" font-size="10">FOCUS</text>
    <text x="573" y="136" text-anchor="middle" fill="#606a65" font-size="10">MINIMAL</text>
    <text x="704" y="136" text-anchor="middle" fill="#6ee7a8" font-size="10" font-weight="700">CUSTOM</text>

    <text x="258" y="186" fill="#606a65" font-size="9" font-weight="700" letter-spacing="2">MODULE PIPELINE</text>
    <text x="772" y="186" text-anchor="end" fill="#606a65" font-size="8">SPACE TOGGLE · ± PRIORITY · ↑↓ MOVE</text>

    <rect x="258" y="202" width="514" height="54" fill="#111416" stroke="#29302d"/>
    <text x="274" y="234" fill="#606a65" font-size="10">01</text><text x="307" y="234" fill="#6ee7a8" font-size="11">[X]</text><text x="346" y="234" fill="#f1f5f2" font-size="11">Model</text>
    <text x="486" y="234" fill="#67d8ef" font-size="9">WIDE</text><text x="544" y="234" fill="#606a65" font-size="9">SLIM</text><text x="704" y="234" fill="#98a39d" font-size="9">P:10</text>

    <rect x="258" y="257" width="514" height="54" fill="#1a1f21" stroke="#6ee7a8" stroke-width="2"/>
    <text x="274" y="289" fill="#6ee7a8" font-size="10">02</text><text x="307" y="289" fill="#6ee7a8" font-size="11">[X]</text><text x="346" y="289" fill="#f1f5f2" font-size="11" font-weight="700">Exec state</text>
    <text x="486" y="289" fill="#6ee7a8" font-size="9">WIDE</text><text x="544" y="289" fill="#6ee7a8" font-size="9">SLIM</text><text x="680" y="289" fill="#6ee7a8" font-size="9">ACTIVE</text>

    <rect x="258" y="312" width="514" height="54" fill="#111416" stroke="#29302d"/>
    <text x="274" y="344" fill="#606a65" font-size="10">03</text><text x="307" y="344" fill="#6ee7a8" font-size="11">[X]</text><text x="346" y="344" fill="#f1f5f2" font-size="11">Context</text>
    <text x="486" y="344" fill="#67d8ef" font-size="9">WIDE</text><text x="544" y="344" fill="#606a65" font-size="9">SLIM</text><text x="690" y="344" fill="#98a39d" font-size="9">WARN 75%</text>

    <rect x="258" y="367" width="514" height="54" fill="#111416" stroke="#29302d"/>
    <text x="274" y="399" fill="#606a65" font-size="10">04</text><text x="307" y="399" fill="#606a65" font-size="11">[ ]</text><text x="346" y="399" fill="#606a65" font-size="11">Git state</text>
    <text x="486" y="399" fill="#606a65" font-size="9">WIDE</text><text x="544" y="399" fill="#606a65" font-size="9">SLIM</text><text x="688" y="399" fill="#606a65" font-size="9">STAGED</text>

    <text x="258" y="461" fill="#606a65" font-size="9" font-weight="700" letter-spacing="2">BEHAVIOR</text>
    <text x="258" y="492" fill="#6ee7a8" font-size="11">(●)</text><text x="290" y="492" fill="#f1f5f2" font-size="10">Responsive compaction</text>
    <text x="486" y="492" fill="#6ee7a8" font-size="11">(●)</text><text x="518" y="492" fill="#f1f5f2" font-size="10">Event-driven redraw</text>
    <text x="258" y="526" fill="#606a65" font-size="11">( )</text><text x="290" y="526" fill="#606a65" font-size="10">Legacy terminal mode</text>

    <text x="824" y="98" fill="#606a65" font-size="9" font-weight="700" letter-spacing="2">SCENARIO · NORMAL</text>
    <text x="1152" y="98" text-anchor="end" fill="#67d8ef" font-size="9">86 COL</text>
    <rect x="824" y="116" width="332" height="56" fill="#0b0d0e" stroke="#29302d"/>
    <text x="840" y="149" fill="#f1f5f2" font-size="9">gpt-5.6</text><text x="891" y="149" fill="#606a65" font-size="9">│</text><text x="905" y="149" fill="#6ee7a8" font-size="9">⟳ 8s</text><text x="944" y="149" fill="#606a65" font-size="9">│</text><text x="958" y="149" fill="#f1f5f2" font-size="9">ctx 42%</text><text x="1014" y="149" fill="#606a65" font-size="9">│</text><text x="1028" y="149" fill="#67d8ef" font-size="9">↑2</text><text x="1052" y="149" fill="#606a65" font-size="9">│</text><text x="1066" y="149" fill="#f3c969" font-size="9">main*</text>

    <text x="824" y="215" fill="#606a65" font-size="9">NARROW · 32 COL</text>
    <rect x="824" y="228" width="230" height="52" fill="#0b0d0e" stroke="#29302d"/>
    <text x="840" y="260" fill="#6ee7a8" font-size="10">⟳ 8s</text><text x="884" y="260" fill="#606a65" font-size="10">│</text><text x="900" y="260" fill="#f1f5f2" font-size="10">42%</text><text x="932" y="260" fill="#606a65" font-size="10">│</text><text x="948" y="260" fill="#f3c969" font-size="10">main*</text>

    <text x="824" y="324" fill="#f3c969" font-size="9">DEGRADED · APP-SERVER UNAVAILABLE</text>
    <rect x="824" y="337" width="332" height="52" fill="#0b0d0e" stroke="#f3c969" stroke-opacity=".45"/>
    <text x="840" y="368" fill="#98a39d" font-size="9">gpt-5.6 | RUN 8s | context unavailable | main*</text>

    <text x="824" y="438" fill="#6ee7a8" font-size="9" font-weight="700" letter-spacing="1">PENDING TOML CHANGES</text>
    <rect x="824" y="452" width="332" height="120" fill="#0b0d0e" stroke="#29302d"/>
    <text x="840" y="478" fill="#34d17b" font-size="9">+ [[layout.modules]]</text>
    <text x="840" y="498" fill="#f1f5f2" font-size="9">+ id = "exec"</text>
    <text x="840" y="518" fill="#f1f5f2" font-size="9">+ compact = true</text>
    <text x="840" y="538" fill="#f37b83" font-size="9">- id = "git"</text>
    <text x="840" y="558" fill="#606a65" font-size="9">  # hidden in narrow mode</text>
  </g>

  <rect x="20" y="626" width="1160" height="44" fill="#111416"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">
    <text x="42" y="653" fill="#98a39d">↑↓ MOVE</text>
    <text x="124" y="653" fill="#98a39d">SPACE TOGGLE</text>
    <text x="246" y="653" fill="#98a39d">± PRIORITY</text>
    <text x="362" y="653" fill="#98a39d">P PREVIEW</text>
    <rect x="1006" y="638" width="70" height="20" fill="#6ee7a8"/>
    <text x="1041" y="652" text-anchor="middle" fill="#0b0d0e">S SAVE</text>
    <text x="1094" y="653" fill="#f37b83">Q CANCEL</text>
  </g>
</svg>
