<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Codexline terminal companion preview</title>
  <desc id="desc">A dark terminal showing Codex with a responsive status line for model, active command, context, agents, and Git branch.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101513"/>
      <stop offset="1" stop-color="#090b0c"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#23302a" stroke-width="1" opacity=".34"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#fade)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <circle cx="1040" cy="-10" r="270" fill="#34d17b" opacity=".05"/>
  <circle cx="120" cy="520" r="250" fill="#67d8ef" opacity=".035"/>

  <g transform="translate(64 46)">
    <text x="0" y="20" fill="#6ee7a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">CODEXLINE</text>
    <text x="0" y="60" fill="#f1f5f2" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="750" letter-spacing="-1">Know what Codex is doing.</text>
    <text x="0" y="88" fill="#98a39d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">A fast, configurable status line that stays out of your way.</text>
    <g transform="translate(884 8)">
      <rect width="190" height="30" fill="#111416" stroke="#29302d"/>
      <circle cx="17" cy="15" r="4" fill="#f3c969"/>
      <text x="30" y="20" fill="#98a39d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">DESIGN PREVIEW</text>
    </g>
  </g>

  <g transform="translate(64 164)" filter="url(#shadow)">
    <rect width="1072" height="306" fill="#0b0d0e" stroke="#38423d"/>
    <rect width="1072" height="36" fill="#111416"/>
    <circle cx="20" cy="18" r="5" fill="#f37b83"/>
    <circle cx="38" cy="18" r="5" fill="#f3c969"/>
    <circle cx="56" cy="18" r="5" fill="#6ee7a8"/>
    <text x="536" y="23" text-anchor="middle" fill="#606a65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">codex — ~/src/codexline</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="24" y="72" fill="#606a65">$</text>
      <text x="42" y="72" fill="#f1f5f2">codex</text>
      <text x="24" y="108" fill="#6ee7a8">›</text>
      <text x="44" y="108" fill="#f1f5f2">Implement the PTY relay and keep direct Codex fallback safe.</text>
      <text x="24" y="143" fill="#67d8ef">●</text>
      <text x="44" y="143" fill="#98a39d">Working</text>
      <text x="116" y="143" fill="#606a65">reading process backend · 2 agents active</text>
      <text x="24" y="179" fill="#606a65">  ├─ inspect Unix PTY lifecycle</text>
      <text x="24" y="204" fill="#606a65">  └─ verify Windows ConPTY resize behavior</text>
    </g>

    <rect x="0" y="248" width="1072" height="58" fill="#111416"/>
    <rect x="0" y="248" width="5" height="58" fill="#6ee7a8"/>
    <g transform="translate(22 283)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="0" y="0" fill="#f1f5f2" font-weight="700">Codex gpt-5.6 high</text>
      <text x="194" y="0" fill="#606a65">│</text>
      <text x="216" y="0" fill="#6ee7a8">⟳ exec 8s</text>
      <text x="314" y="0" fill="#606a65">│</text>
      <text x="336" y="0" fill="#f1f5f2">ctx ▓▓▓░░ 42%</text>
      <text x="476" y="0" fill="#606a65">│</text>
      <text x="498" y="0" fill="#67d8ef">↑2 agents</text>
      <text x="594" y="0" fill="#606a65">│</text>
      <text x="616" y="0" fill="#f3c969">feat/pty *</text>
      <text x="1040" y="0" text-anchor="end" fill="#606a65">PTY ACTIVE</text>
    </g>
  </g>
</svg>
