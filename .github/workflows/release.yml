name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to Cargo package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

  build:
    name: Build / ${{ matrix.target }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test native target
        run: cargo test --workspace --all-features --locked
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="codexline-${{ matrix.target }}.tar.gz"
          mkdir -p package dist
          cp "target/${{ matrix.target }}/release/codexline" package/
          cp LICENSE README.md package/
          tar -czf "dist/${asset}" -C package .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}" > "${asset}.sha256")
          else
            (cd dist && shasum -a 256 "${asset}" > "${asset}.sha256")
          fi
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Asset = "codexline-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Path package,dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/codexline.exe" package/
          Copy-Item LICENSE,README.md package/
          Compress-Archive -Path package/* -DestinationPath "dist/$Asset"
          $Hash = (Get-FileHash -Algorithm SHA256 "dist/$Asset").Hash.ToLower()
          "$Hash  $Asset" | Set-Content -NoNewline "dist/$Asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag --generate-notes --title "Codexline ${GITHUB_REF_NAME}"
