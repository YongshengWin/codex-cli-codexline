[package]
name = "codexline"
version = "0.1.0"
edition = "2024"
description = "A fast, cross-platform companion status line for the Codex CLI"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
unicode-width = "0.2"
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
